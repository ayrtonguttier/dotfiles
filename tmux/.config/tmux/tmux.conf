set -g default-terminal 'tmux-256color'
set -ag terminal-overrides ',xterm-256color:RGB'
set -g mode-keys vi
set -g prefix C-f
set -g mouse on
set -g detach-on-destroy off
# set -g prefix2 C-s

# reasonable defaults
#set -g base-index 1
#setw -g pane-base-index 1
set -g renumber-windows on
set -g escape-time 10
set -g history-limit 50000
set -g focus-events on
set -g set-clipboard on

bind r source-file ~/.config/tmux/tmux.conf \; display 'reloaded config'

bind -n M-h select-window -t :-
bind -n M-l select-window -t :+
bind -n M-n new-window
bind -n M-q kill-window
bind -n M-y copy-mode
bind -n M-p paste-buffer
bind -n M-d detach
bind C-f new-window '/home/ayrtonguttier/.config/tmux/sessionizer'

bind '|' split-window -h -c '#{pane_current_path}'
bind '-' split-window -v -c '#{pane_current_path}'
unbind '"'
unbind %

bind -n M-Left select-pane -L
bind -n M-Right select-pane -R
bind -n M-Up select-pane -U
bind -n M-Down select-pane -D

bind -r H resize-pane -L 5
bind -r L resize-pane -R 5
bind -r K resize-pane -U 5
bind -r J resize-pane -D 5

# Tokyo Night theme
tokyonight_bg="#1a1b26"
tokyonight_bg_dark="#16161e"
tokyonight_bg_highlight="#292e42"
tokyonight_fg="#c0caf5"
tokyonight_fg_dark="#a9b1d6"
tokyonight_comment="#565f89"
tokyonight_blue="#7aa2f7"
tokyonight_cyan="#7dcfff"
tokyonight_green="#9ece6a"
tokyonight_magenta="#bb9af7"
tokyonight_red="#f7768e"
tokyonight_yellow="#e0af68"

set -g status on
set -g status-interval 5
set -g status-position bottom
set -g status-justify left
set -g status-style "bg=$tokyonight_bg_dark,fg=$tokyonight_fg_dark"

set -g message-style "bg=$tokyonight_bg_highlight,fg=$tokyonight_fg"
set -g message-command-style "bg=$tokyonight_bg_highlight,fg=$tokyonight_fg"

set -g pane-border-style "fg=$tokyonight_bg_highlight"
set -g pane-active-border-style "fg=$tokyonight_blue"

set -g status-left-length 40
set -g status-left "#[bg=$tokyonight_blue,fg=$tokyonight_bg_dark,bold] #S #[bg=$tokyonight_bg_dark,fg=$tokyonight_blue]"

set -g status-right-length 60
set -g status-right "#[fg=$tokyonight_comment]#[bg=$tokyonight_bg_highlight,fg=$tokyonight_fg_dark] %Y-%m-%d  %H:%M #[bg=$tokyonight_bg_highlight,fg=$tokyonight_magenta]#[bg=$tokyonight_magenta,fg=$tokyonight_bg_dark,bold] #h "

setw -g window-status-style "bg=$tokyonight_bg_dark,fg=$tokyonight_comment"
setw -g window-status-format " #I:#W "
setw -g window-status-current-style "bg=$tokyonight_bg_highlight,fg=$tokyonight_cyan,bold"
setw -g window-status-current-format " #I:#W "
setw -g window-status-activity-style "bg=$tokyonight_bg_dark,fg=$tokyonight_yellow"
setw -g window-status-bell-style "bg=$tokyonight_bg_dark,fg=$tokyonight_red,bold"

set -g clock-mode-colour "$tokyonight_blue"
